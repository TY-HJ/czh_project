server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 敏感配置支持环境变量外置(S9): DB_USERNAME / DB_PASSWORD
    # 本地开发可用不入库的 application-local.yml 覆盖, 生产环境务必通过环境变量注入
    url: jdbc:mysql://localhost:3306/repair_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置: JWT_SECRET 支持环境变量注入, 生产环境必须更换
jwt:
  secret: ${JWT_SECRET:RepairSystemJwtSecretKey-PleaseChangeMe-2026}
  expire-hours: 24

# 图片上传保存目录: UPLOAD_DIR 支持环境变量, 默认为本项目 backend/uploads 绝对路径
upload:
  dir: ${UPLOAD_DIR:D:/Workbuddy/work_space/repair-system/backend/uploads}

# AI 辅助填写(暂未启用)
# 现状: 后端代码与接口已就绪, 前端入口已撤下, 默认关闭(enabled: false), 不影响任何现有功能
# 将来若要启用: 1) 把 enabled 改为 true  2) 配置环境变量 AI_API_KEY  3) 前端两个表单加回调用按钮
# 密钥安全: 严禁把 sk-xxx 直接写在这里(会随代码提交到 GitHub), 必须走环境变量
ai:
  enabled: false
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}
  api-key: ${AI_API_KEY:}
  timeout-seconds: 20
  max-tokens: 400
